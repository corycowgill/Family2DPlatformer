# Render Blueprint: static site built from source.
# Dashboard equivalent: Build Command `npm ci && npm run build`, Publish Directory `dist`.
services:
  - type: web
    name: family2dplatformer
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: "22"
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache
