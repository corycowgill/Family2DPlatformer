<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1730" />
    <meta name="color-scheme" content="dark" />
    <meta name="format-detection" content="telephone=no" />
    <!-- Home-screen web app (iPhone's only true fullscreen; Android uses the manifest). -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Chicago Family" />
    <meta name="application-name" content="Chicago Family" />
    <meta name="description" content="Chicago Family Adventure - a family platformer through the Chicago Loop." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 fill=%22%23b3ddf2%22/%3E%3Cpath d=%22M8 3l1.2 3.3H13l-3 2 1.1 3.4L8 9.6 4.9 11.7 6 8.3l-3-2h3.8z%22 fill=%22%23e8414e%22/%3E%3C/svg%3E" />
    <title>Chicago Family Adventure</title>
    <!-- Studio ident. Vendored from gameCentral/intro/hallucinated-intro.js so this
         game stays a self-contained deploy; re-copy that file to take an update.
         Plain script, not a module: it defines window.HallucinatedIntro. -->
    <script src="./intro/hallucinated-intro.js"></script>
    <style>
      html, body {
        margin: 0; padding: 0; width: 100%; height: 100%; height: 100dvh; background: #0b1730;
        overflow: hidden;
        touch-action: none; overscroll-behavior: none;
        -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
      }
      /* Fixed body: no rubber-band scrolling of the page on iOS. */
      body { position: fixed; inset: 0; }
      /* Phaser's autoCenter positions the canvas; no flex centering on top (it double-offsets). */
      #game { position: fixed; inset: 0; }
      #game canvas { image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; -webkit-touch-callout: none; outline: none; }
      #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; box-sizing: border-box; color: #cfe3ff; font: 16px monospace; text-align: center; }
      #boot small { max-width: min(640px, 100%); overflow-wrap: anywhere; color: #ffd25a; font-size: 13px; line-height: 1.5; -webkit-user-select: text; user-select: text; }
    </style>
  </head>
  <body>
    <!-- Start the studio ident before anything else paints. Classic script at the top of
         <body> (a module is deferred and would let the loader paint first). PreloadScene
         awaits window.__studioIntro before showing the title, so the game loads underneath. -->
    <script>
      window.__studioIntro = (function () {
        try {
          var q = new URLSearchParams(location.search);
          // Dev/test entry points and automated browsers skip the ident so its overlay
          // doesn't swallow synthetic input.
          if (q.has('nointro') || q.has('test') || q.has('debug') || q.has('level') || q.has('screen') ||
              navigator.webdriver || !window.HallucinatedIntro) {
            return Promise.resolve();
          }
          // No sting: on a cold load there is no user gesture yet, so audio would be dropped.
          return window.HallucinatedIntro.play({ skippable: true, sound: false }).catch(function () {});
        } catch (e) {
          return Promise.resolve();
        }
      })();
    </script>
    <div id="boot">Loading Chicago…</div>
    <script>
      // Boot diagnostics: if the game can't start, say why instead of showing "Loading" forever.
      // Errors are collected (never overwritten); a stall runs a probe of the game script.
      (function () {
        var boot = document.getElementById('boot');
        var errors = [];
        window.__cfaStage = 'html';
        function render(title, lines) {
          if (!boot || !boot.isConnected) return;
          boot.innerHTML = '';
          var t = document.createElement('div');
          t.textContent = title;
          boot.appendChild(t);
          lines.forEach(function (line) {
            var d = document.createElement('small');
            d.textContent = line;
            boot.appendChild(d);
          });
        }
        var hostHint = location.protocol === 'file:'
          ? 'The game must be served by a web server, not opened as a file. Run "npm install && npm run dev" and open the address it prints.'
          : 'The host must build the game ("npm ci && npm run build") and publish the "dist" folder (Render: Build Command + Publish Directory = dist).';
        function fail(line) {
          if (errors.indexOf(line) === -1) errors.push(line);
          render("Couldn't start Chicago Family Adventure", errors.concat(['Stage: ' + window.__cfaStage]));
        }
        window.addEventListener('error', function (e) {
          var el = e.target;
          if (el && el.tagName === 'SCRIPT') fail('Script failed to load: ' + (el.src || 'module') + '. ' + hostHint);
          else if (e.message) fail('Error: ' + e.message + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : ''));
        }, true);
        window.addEventListener('unhandledrejection', function (e) {
          fail('Error: ' + (e.reason && e.reason.message ? e.reason.message : String(e.reason)));
        });
        // Stall probe: what is the server actually returning for the game script?
        setTimeout(function () {
          if (!boot || !boot.isConnected) return;
          var src = '';
          var scripts = document.querySelectorAll('script[type="module"]');
          if (scripts.length) src = scripts[scripts.length - 1].src;
          var lines = errors.slice();
          var title = errors.length ? "Couldn't start Chicago Family Adventure" : 'Chicago Family Adventure is taking too long';
          lines.push('Still starting after 20s (stage: ' + window.__cfaStage + ').');
          if (/\/src\/main\.ts/.test(src)) lines.push('This page is the UNBUILT source (it loads /src/main.ts). ' + hostHint);
          lines.push('Browser: ' + navigator.userAgent);
          render(title, lines.concat(['Checking ' + src + ' …']));
          if (!src || !window.fetch) return;
          fetch(src, { cache: 'no-store' }).then(function (r) {
            return r.text().then(function (body) {
              lines.push('Script ' + src.split('/').pop() + ': HTTP ' + r.status + ', ' + (r.headers.get('content-type') || 'no content-type') + ', ' + body.length + ' bytes, starts "' + body.slice(0, 40).replace(/\s+/g, ' ') + '"');
              if (/^\s*</.test(body)) lines.push('The server returned HTML instead of JavaScript (a rewrite/redirect rule or missing file). ' + hostHint);
              lines.push('Try reloading. If this persists, send a screenshot of this screen.');
              render(title, lines);
            });
          }).catch(function (err) {
            lines.push('Could not fetch the script: ' + err);
            render(title, lines);
          });
        }, 20000);
      })();
    </script>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
